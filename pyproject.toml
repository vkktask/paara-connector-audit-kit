[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paara-scanner"
version = "0.1.0"
description = "PAARA seven-factor connector risk scanner"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
paara-scanner = "paara_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
